[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integration-agent"
version = "0.1.0"
description = "APIForge — Autonomous API Integration Agent: automatically integrate third-party OpenAPI APIs into existing Python projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",  # 生成代码/生成测试的运行时依赖（TestRunner 子进程环境需要）
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/integration_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["integration_agent"]
